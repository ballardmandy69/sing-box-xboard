name: AnyTLS compatibility

on:
  push:
    branches: [main]
    paths:
      - 'third_party/sing-anytls/**'
      - 'third_party/sing-vmess/**'
      - 'third_party/sing-shadowsocks/**'
      - 'common/usercontrol/**'
      - 'experimental/libbox/internal/oomprofile/**'
      - 'protocol/vmess/**'
      - 'protocol/vless/**'
      - 'protocol/shadowsocks/**'
      - 'route/**'
      - 'dns/**'
      - 'service/ssmapi/**'
      - 'option/nyafw.go'
      - 'nyafw*.go'
      - 'tcp_only*.go'
      - 'protocol/anytls/**'
      - 'protocol/trojan/**'
      - 'transport/trojan/**'
      - 'protocol/anytlsnative/**'
      - 'transport/anytlsnative/**'
      - 'cmd/sing-box/**'
      - 'service/xboard/**'
      - 'adapter/inbound*'
      - 'adapter/inbound/**'
      - 'adapter/outbound_bind.go'
      - 'common/listener/**'
      - 'common/dialer/**'
      - 'option/inbound.go'
      - 'option/service.go'
      - 'config.xboard.json'
      - 'server.xboard.yml'
      - 'option/anytls_native.go'
      - 'install.sh'
      - 'sb-auto.sh'
      - 'test/install_test.sh'
      - 'config.anytls-native.json'
      - 'server.anytls-native.yml'
      - 'config.anytls.json'
      - 'server.anytls.yml'
      - 'config.trojan.json'
      - 'server.trojan.yml'
      - 'release/package-xboard.sh'
      - 'option/anytls.go'
      - 'go.mod'
      - '.github/workflows/anytls-compat.yml'
  pull_request:
    paths:
      - 'third_party/sing-anytls/**'
      - 'third_party/sing-vmess/**'
      - 'third_party/sing-shadowsocks/**'
      - 'common/usercontrol/**'
      - 'experimental/libbox/internal/oomprofile/**'
      - 'protocol/vmess/**'
      - 'protocol/vless/**'
      - 'protocol/shadowsocks/**'
      - 'route/**'
      - 'dns/**'
      - 'service/ssmapi/**'
      - 'option/nyafw.go'
      - 'nyafw*.go'
      - 'tcp_only*.go'
      - 'protocol/anytls/**'
      - 'protocol/trojan/**'
      - 'transport/trojan/**'
      - 'protocol/anytlsnative/**'
      - 'transport/anytlsnative/**'
      - 'cmd/sing-box/**'
      - 'service/xboard/**'
      - 'adapter/inbound*'
      - 'adapter/inbound/**'
      - 'adapter/outbound_bind.go'
      - 'common/listener/**'
      - 'common/dialer/**'
      - 'option/inbound.go'
      - 'option/service.go'
      - 'config.xboard.json'
      - 'server.xboard.yml'
      - 'option/anytls_native.go'
      - 'install.sh'
      - 'sb-auto.sh'
      - 'test/install_test.sh'
      - 'config.anytls-native.json'
      - 'server.anytls-native.yml'
      - 'config.anytls.json'
      - 'server.anytls.yml'
      - 'config.trojan.json'
      - 'server.trojan.yml'
      - 'release/package-xboard.sh'
      - 'option/anytls.go'
      - 'go.mod'
      - '.github/workflows/anytls-compat.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Upstream interoperability, TLS and padding budget
        working-directory: third_party/sing-anytls
        run: go test -race ./... -count=1 -timeout=180s
      - name: sing-box integration
        run: go test ./protocol/anytls ./option ./cmd/sing-box
      - name: Native transport, panel and revocation races
        run: >-
          go test -race ./transport/anytlsnative ./protocol/anytlsnative
          ./transport/trojan ./protocol/trojan ./protocol/anytls ./service/xboard
          ./adapter/inbound ./common/listener ./common/dialer
      - name: Build client and server
        run: go build -o "$RUNNER_TEMP/sing-box" ./cmd/sing-box
      - name: Restored routing, DNS, accounting and TCP protocol behavior
        run: >-
          go test ./protocol/vmess ./protocol/vless ./protocol/shadowsocks ./route/...
          ./dns/... ./common/usercontrol ./service/ssmapi . -count=1 -timeout=180s
      - name: Restored runtime races
        run: >-
          go test -race ./protocol/vmess ./protocol/vless ./protocol/shadowsocks ./route/...
          ./dns/... ./common/usercontrol ./service/ssmapi . -count=1 -timeout=180s
      - name: OOM profile generation with default Go link checks
        run: go test ./experimental/libbox/internal/oomprofile ./experimental/libbox ./experimental/boxdd -count=1 -timeout=90s
      - name: VMess credential generations and hot authentication
        working-directory: third_party/sing-vmess
        run: go test -race ./... -count=1 -timeout=180s
      - name: Shadowsocks credential generations and hot authentication
        working-directory: third_party/sing-shadowsocks
        run: go test -race ./... -count=1 -timeout=180s
      - name: Install and update deployment
        run: SING_BOX_BINARY="$RUNNER_TEMP/sing-box" bash test/install_test.sh
