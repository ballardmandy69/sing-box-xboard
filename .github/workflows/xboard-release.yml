name: xboard-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goamd64: v1
          - arch: amd64v3
            goarch: amd64
            goamd64: v3
          - arch: arm64
            goarch: arm64
            goamd64: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/sagernet/sing-box/constant.Version=${GITHUB_REF_NAME#v}" -o sing-box ./cmd/sing-box
          tar -czf sing-box-xboard-${{ matrix.arch }}.tar.gz sing-box
      - name: Checksums
        run: sha256sum sing-box-xboard-${{ matrix.arch }}.tar.gz > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xboard-${{ matrix.arch }}
          path: |
            sing-box-xboard-${{ matrix.arch }}.tar.gz
            SHA256SUMS-${{ matrix.arch }}.txt
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: xboard-*
          merge-multiple: true
      - name: Merge checksums
        run: cat artifacts/SHA256SUMS-*.txt | sed 's#artifacts/##' > artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sing-box-xboard-*.tar.gz
            artifacts/SHA256SUMS.txt
